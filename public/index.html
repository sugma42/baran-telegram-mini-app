<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>БАРАН — Казино</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #08040e;
    --bg2: #130821;
    --purple: #8b5cf6;
    --purple2: #a855f7;
    --purple3: #6d28d9;
    --text: #fff;
    --muted: #9d92a9;
    --green: #4ade80;
    --red: #fb7185;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(139,92,246,.38),
            transparent 40%
        ),
        radial-gradient(
            circle at 0% 50%,
            rgba(124,58,237,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            var(--bg2),
            var(--bg)
        );
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 14px 14px 35px;
}

/* BACKGROUND */

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%);
    background: rgba(168,85,247,.15);
    filter: blur(100px);
    pointer-events: none;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    font-size: 24px;
    background: linear-gradient(
        135deg,
        #a855f7,
        #6d28d9
    );
    box-shadow:
        0 10px 30px
        rgba(139,92,246,.45);
}

.logo-title {
    font-size: 18px;
    font-weight: 900;
}

.logo-sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
}

.balance {
    padding: 8px 12px;
    border-radius: 14px;
    text-align: right;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(15px);
}

.balance-label {
    color: #8e8398;
    font-size: 9px;
    font-weight: 700;
}

.balance-value {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 900;
}

/* HERO */

.hero {
    text-align: center;
    margin: 23px 0 18px;
}

.hero h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 900;
    letter-spacing: -.8px;
}

.hero p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* SLOT */

.slot-card {
    padding: 17px;
    border-radius: 27px;
    border: 1px solid rgba(255,255,255,.11);
    background:
        linear-gradient(
            145deg,
            rgba(168,85,247,.16),
            rgba(255,255,255,.035)
        );
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
}

.slot-label {
    text-align: center;
    margin-bottom: 12px;
    color: #c4b5fd;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.reels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 9px;
    border-radius: 22px;
    background: rgba(0,0,0,.38);
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: inset 0 0 30px rgba(0,0,0,.5);
}

.reel {
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 17px;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );
    border: 1px solid rgba(255,255,255,.08);
    font-size: 49px;
    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 8px 20px rgba(0,0,0,.25);
}

.reel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.2)
        );
}

.reel.spinning {
    animation: reelShake .08s linear infinite;
}

@keyframes reelShake {
    0% {
        transform: translateY(-3px);
    }
    50% {
        transform: translateY(3px);
    }
    100% {
        transform: translateY(-3px);
    }
}

/* RESULT */

.result {
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 900;
}

.result.neutral {
    color: #aaa0b5;
}

.result.win {
    color: #c4b5fd;
    text-shadow:
        0 0 20px
        rgba(168,85,247,.9);
}

.result.lose {
    color: var(--red);
}

/* SECTION */

.section-title {
    margin: 19px 3px 8px;
    color: #978ba2;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* BET */

.bet-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 18px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.10);
}

.bet-button {
    width: 48px;
    height: 44px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: rgba(255,255,255,.075);
    font-size: 24px;
    cursor: pointer;
}

.bet-button:active {
    transform: scale(.93);
    background: rgba(139,92,246,.3);
}

.bet-center {
    flex: 1;
    text-align: center;
}

.bet-label {
    color: #8d8298;
    font-size: 9px;
}

.bet-value {
    margin-top: 2px;
    font-size: 21px;
    font-weight: 900;
}

/* QUICK BET */

.quick-bets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.quick {
    height: 38px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.045);
    color: #c9c0d0;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
}

.quick.active {
    color: white;
    border-color: rgba(168,85,247,.6);
    background: rgba(139,92,246,.23);
}

/* SPIN */

.spin {
    width: 100%;
    height: 59px;
    margin-top: 13px;
    border: 0;
    border-radius: 18px;
    color: white;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: .5px;
    cursor: pointer;
    background:
        linear-gradient(
            135deg,
            #a855f7,
            #7c3aed,
            #6d28d9
        );
    box-shadow:
        0 12px 32px
        rgba(124,58,237,.42),
        inset 0 1px
        rgba(255,255,255,.25);
    transition: .15s;
}

.spin:active {
    transform: scale(.98);
}

.spin:disabled {
    opacity: .55;
}

/* HISTORY */

.history {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 13px;
    border-radius: 15px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.06);
}

.history-symbols {
    font-size: 20px;
    letter-spacing: 1px;
}

.history-right {
    text-align: right;
}

.history-bet {
    color: #80758b;
    font-size: 9px;
    margin-bottom: 2px;
}

.history-mult {
    font-size: 13px;
    font-weight: 900;
}

.history-mult.win {
    color: var(--green);
}

.history-mult.lose {
    color: var(--red);
}

.empty {
    text-align: center;
    color: #786e80;
    padding: 14px;
    font-size: 12px;
}

/* PAYTABLE */

.paytable {
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
}

.pay-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 13px;
    border-bottom: 1px solid rgba(255,255,255,.055);
    font-size: 13px;
}

.pay-row:last-child {
    border-bottom: 0;
}

.pay-combo {
    letter-spacing: 2px;
}

.pay-mult {
    color: #c4b5fd;
    font-weight: 900;
}

/* WIN */

.win-animation {
    animation: winPulse .5s ease;
}

@keyframes winPulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }

    100% {
        transform: scale(1);
    }
}

/* ERROR */

.error {
    display: none;
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 14px;
    text-align: center;
    color: #fecdd3;
    background: rgba(244,63,94,.12);
    border: 1px solid rgba(244,63,94,.25);
    font-size: 12px;
}

.error.show {
    display: block;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <div class="logo-icon">
                🐏
            </div>

            <div>

                <div class="logo-title">
                    БАРАН
                </div>

                <div class="logo-sub">
                    PvP • Casino
                </div>

            </div>

        </div>

        <div class="balance">

            <div class="balance-label">
                БАЛАНС
            </div>

            <div class="balance-value">
                💎 <span id="balance">1000</span>
            </div>

        </div>

    </div>


    <!-- HERO -->

    <div class="hero">

        <h1>
            🎰 Казино
        </h1>

        <p>
            Испытай удачу и поймай комбинацию
        </p>

    </div>


    <div
        class="error"
        id="error"
    ></div>


    <!-- SLOT -->

    <div
        class="slot-card"
        id="slotCard"
    >

        <div class="slot-label">
            ✦ SLOT MACHINE ✦
        </div>

        <div class="reels">

            <div
                class="reel"
                id="reel1"
            >
                🍋
            </div>

            <div
                class="reel"
                id="reel2"
            >
                7️⃣
            </div>

            <div
                class="reel"
                id="reel3"
            >
                🍒
            </div>

        </div>

        <div
            class="result neutral"
            id="result"
        >
            Сделай ставку и крути
        </div>

    </div>


    <!-- BET -->

    <div class="section-title">
        Ставка
    </div>

    <div class="bet-box">

        <button
            class="bet-button"
            id="minus"
        >
            −
        </button>

        <div class="bet-center">

            <div class="bet-label">
                ВАША СТАВКА
            </div>

            <div class="bet-value">
                💎 <span id="bet">50</span>
            </div>

        </div>

        <button
            class="bet-button"
            id="plus"
        >
            +
        </button>

    </div>


    <!-- QUICK BET -->

    <div class="section-title">
        Быстрая ставка
    </div>

    <div class="quick-bets">

        <button
            class="quick"
            data-value="10"
        >
            10
        </button>

        <button
            class="quick active"
            data-value="50"
        >
            50
        </button>

        <button
            class="quick"
            data-value="100"
        >
            100
        </button>

        <button
            class="quick"
            data-value="250"
        >
            250
        </button>

    </div>


    <!-- SPIN -->

    <button
        class="spin"
        id="spin"
    >
        🎰 КРУТИТЬ
    </button>


    <!-- HISTORY -->

    <div class="section-title">
        Последние игры
    </div>

    <div
        class="history"
        id="history"
    >

        <div class="empty">
            Здесь появятся результаты
        </div>

    </div>


    <!-- PAYTABLE -->

    <div class="section-title">
        Таблица выплат
    </div>

    <div
        class="paytable"
        id="paytable"
    ></div>

</div>


<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#09050f");
        tg.setBackgroundColor("#09050f");
    } catch (e) {}
}

let balance = 0;
let bet = 50;
let spinning = false;

const symbols = ["🍋", "7️⃣", "🍒", "💀"];

const balanceEl = document.getElementById("balance");
const betEl = document.getElementById("bet");
const resultEl = document.getElementById("result");
const spinEl = document.getElementById("spin");
const errorEl = document.getElementById("error");
const historyEl = document.getElementById("history");
const slotCard = document.getElementById("slotCard");

const reels = [
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

function telegramHeaders() {
    const initData = tg?.initData || "";

    return {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": initData
    };
}

async function api(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            ...telegramHeaders(),
            ...(options.headers || {})
        }
    });

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Сервер вернул некорректный ответ");
    }

    if (!response.ok || data.success === false) {
        throw new Error(data.error || "Ошибка сервера");
    }

    return data;
}

function updateUI() {
    balanceEl.textContent = balance.toLocaleString("ru-RU");
    betEl.textContent = bet.toLocaleString("ru-RU");

    document.querySelectorAll(".quick").forEach(button => {
        button.classList.toggle(
            "active",
            Number(button.dataset.value) === bet
        );
    });
}

function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add("show");

    clearTimeout(showError.timer);

    showError.timer = setTimeout(() => {
        errorEl.classList.remove("show");
    }, 3500);
}

function showResult(text, type) {
    resultEl.textContent = text;
    resultEl.className = "result " + type;
}

function haptic(type) {
    if (tg?.HapticFeedback) {
        try {
            tg.HapticFeedback.notificationOccurred(type);
        } catch (e) {}
    }
}

function animateReel(reel, finalSymbol, duration) {
    return new Promise(resolve => {
        reel.classList.add("spinning");

        const interval = setInterval(() => {
            reel.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];
        }, 65);

        setTimeout(() => {
            clearInterval(interval);

            reel.textContent = finalSymbol;
            reel.classList.remove("spinning");

            resolve();
        }, duration);
    });
}

function addHistory(combo, multiplier, bet, win) {
    const empty = historyEl.querySelector(".empty");

    if (empty) {
        empty.remove();
    }

    const item = document.createElement("div");
    item.className = "history-item";

    const isWin = win > 0;

    item.innerHTML = `
        <div class="history-symbols">
            ${combo.join("")}
        </div>

        <div class="history-right">
            <div class="history-bet">
                Ставка ${bet} 💎
            </div>

            <div class="history-mult ${isWin ? "win" : "lose"}">
                ${isWin ? "+" + win + " 💎" : "×0"}
            </div>
        </div>
    `;

    historyEl.prepend(item);

    while (historyEl.children.length > 10) {
        historyEl.lastElementChild.remove();
    }
}

function renderHistory(history) {
    historyEl.innerHTML = "";

    if (!history || history.length === 0) {
        historyEl.innerHTML =
            '<div class="empty">Здесь появятся результаты</div>';
        return;
    }

    history.forEach(spin => {
        addHistory(
            spin.combo,
            spin.multiplier,
            spin.bet,
            spin.win
        );
    });
}

async function loadUser() {
    try {
        const data = await api("/api/me");

        balance = Number(data.user.balance);

        updateUI();

        if (data.user.first_name && tg) {
            const name = document.querySelector(".hero p");

            if (name) {
                name.textContent =
                    `Удачи, ${data.user.first_name}!`;
            }
        }

    } catch (error) {
        console.error(error);

        showError(
            "Не удалось подключиться к Telegram"
        );
    }
}

async function loadHistory() {
    try {
        const data = await api("/api/history");

        renderHistory(data.history);

    } catch (error) {
        console.error(error);
    }
}

async function spin() {
    if (spinning) {
        return;
    }

    if (!Number.isInteger(bet) || bet < 10) {
        showError("Минимальная ставка — 10");
        return;
    }

    if (bet > balance) {
        showError("Недостаточно 💎");
        return;
    }

    spinning = true;
    spinEl.disabled = true;
    spinEl.textContent = "⏳ ВРАЩЕНИЕ...";

    showResult(
        "Барабаны вращаются...",
        "neutral"
    );

    try {
        /*
         * ВАЖНО:
         * результат выбирает сервер.
         * Клиент отправляет только размер ставки.
         */
        const data = await api("/api/spin", {
            method: "POST",
            body: JSON.stringify({
                bet
            })
        });

        const result = data.result;

        /*
         * Сервер уже определил комбинацию.
         * Здесь только красиво её показываем.
         */
        await animateReel(
            reels[0],
            result.combo[0],
            800
        );

        await animateReel(
            reels[1],
            result.combo[1],
            1050
        );

        await animateReel(
            reels[2],
            result.combo[2],
            1300
        );

        balance = Number(data.balance);

        updateUI();

        if (result.win > 0) {
            showResult(
                `🎉 ×${result.multiplier}  +${result.win} 💎`,
                "win"
            );

            slotCard.classList.remove("win-animation");

            void slotCard.offsetWidth;

            slotCard.classList.add("win-animation");

            haptic("success");

        } else {
            showResult(
                "💀 Не повезло — ставка сгорела",
                "lose"
            );

            haptic("error");
        }

        /*
         * Перезагружаем историю с сервера,
         * чтобы интерфейс совпадал с базой.
         */
        await loadHistory();

    } catch (error) {
        console.error("SPIN ERROR:", error);

        showError(
            error.message || "Ошибка сервера"
        );
    }

    spinning = false;
    spinEl.disabled = false;
    spinEl.textContent = "🎰 КРУТИТЬ";
}

function renderPaytable() {
    const paytable =
        document.getElementById("paytable");

    /*
     * Таблица выплат соответствует серверной
     * конфигурации.
     */
    const combinations = [
        [["🍋","🍋","🍋"], 3],
        [["7️⃣","7️⃣","7️⃣"], 5],
        [["🍒","🍒","🍒"], 2],
        [["💀","💀","💀"], 0],

        [["🍋","🍋","7️⃣"], 1.8],
        [["🍋","🍋","🍒"], 1.7],
        [["🍋","🍋","💀"], 1.6],

        [["🍋","7️⃣","7️⃣"], 2.9],
        [["🍋","🍒","🍒"], 1.9],
        [["🍋","💀","💀"], 0],

        [["🍋","7️⃣","🍒"], 0],
        [["🍋","7️⃣","💀"], 0],
        [["🍋","🍒","💀"], 0],

        [["7️⃣","7️⃣","🍋"], 2.9],
        [["7️⃣","7️⃣","🍒"], 2.5],
        [["7️⃣","7️⃣","💀"], 1.9],

        [["7️⃣","🍋","🍋"], 2.7],
        [["7️⃣","🍒","🍒"], 2.7],
        [["7️⃣","💀","💀"], 0],

        [["🍒","🍒","🍋"], 1.7],
        [["🍒","🍒","7️⃣"], 1.8],
        [["🍒","🍒","💀"], 1.5],

        [["🍒","🍋","🍋"], 1.8],
        [["🍒","7️⃣","7️⃣"], 1.9],
        [["🍒","💀","💀"], 0]
    ];

    paytable.innerHTML = "";

    combinations.forEach(([combo, multiplier]) => {
        const row = document.createElement("div");

        row.className = "pay-row";

        row.innerHTML = `
            <div class="pay-combo">
                ${combo.join("")}
            </div>

            <div class="pay-mult">
                ×${multiplier}
            </div>
        `;

        paytable.appendChild(row);
    });
}

document
    .getElementById("minus")
    .addEventListener("click", () => {
        if (spinning) return;

        bet = Math.max(10, bet - 10);

        if (balance >= 10 && bet > balance) {
            bet = Math.floor(balance / 10) * 10;
        }

        updateUI();
    });

document
    .getElementById("plus")
    .addEventListener("click", () => {
        if (spinning) return;

        const newBet = bet + 10;

        if (newBet <= 100000 && newBet <= balance) {
            bet = newBet;
        }

        updateUI();
    });

document
    .querySelectorAll(".quick")
    .forEach(button => {
        button.addEventListener("click", () => {
            if (spinning) return;

            const value =
                Number(button.dataset.value);

            if (value > balance) {
                showError("Недостаточно очков");
                return;
            }

            bet = value;
            updateUI();
        });
    });

spinEl.addEventListener("click", spin);

renderPaytable();
updateUI();

/*
 * Запускаем загрузку пользователя и истории
 * только после загрузки Telegram WebApp.
 */
(async () => {
    await loadUser();
    await loadHistory();
})();
</script>
